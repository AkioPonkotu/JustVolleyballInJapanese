name: Build Windows EXE

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-2022
    timeout-minutes: 20
    permissions:
      contents: write
    defaults:
      run:
        shell: pwsh
    steps:
      - name: Check out source
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.12'
          architecture: x64
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-build.txt

      - name: Install build dependencies
        run: python -m pip install -r requirements-build.txt

      - name: Validate translations
        run: python tools/catalog.py validate

      - name: Run tests
        run: python -m unittest discover -s tests -v

      - name: Verify checked-in patch data
        run: python tools/release_data.py

      - name: Build standalone EXE with embedded patch data
        run: python tools/package_release.py --exe-only --output dist/ci

      - name: Smoke test EXE
        run: |
          $process = Start-Process -FilePath ./dist/ci/JustVolleyballJA.exe -ArgumentList '--verify-package' -WindowStyle Hidden -Wait -PassThru
          if ($process.ExitCode -ne 0) { throw "EXE smoke test failed: $($process.ExitCode)" }

      - name: Upload EXE
        uses: actions/upload-artifact@v7
        with:
          name: JustVolleyballJA-windows-x64-${{ github.sha }}
          path: dist/ci/JustVolleyballJA.exe
          if-no-files-found: error
          retention-days: 30

      - name: Publish EXE to GitHub Releases
        if: github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: build-${{ github.run_number }}-${{ github.run_attempt }}
          RELEASE_COMMIT: ${{ github.sha }}
        run: |
          gh release create $env:RELEASE_TAG ./dist/ci/JustVolleyballJA.exe --target $env:RELEASE_COMMIT --title "just volleyball 日本語化パッチ ($env:RELEASE_TAG)" --latest
          if ($LASTEXITCODE -ne 0) { throw 'GitHub Release publication failed' }
