name: Build Windows EXE

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-2022
    timeout-minutes: 20
    defaults:
      run:
        shell: pwsh
    steps:
      - name: Check out source
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.12'
          architecture: x64
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-build.txt

      - name: Install build dependencies
        run: python -m pip install -r requirements-build.txt

      - name: Validate translations
        run: python tools/catalog.py validate

      - name: Run tests
        run: python -m unittest discover -s tests -v

      - name: Build EXE without game files
        run: python tools/package_release.py --exe-only --output dist/ci

      - name: Smoke test EXE
        run: |
          $process = Start-Process -FilePath ./dist/ci/JustVolleyballJA.exe -ArgumentList '--help' -WindowStyle Hidden -Wait -PassThru
          if ($process.ExitCode -ne 0) { throw "EXE smoke test failed: $($process.ExitCode)" }

      - name: Upload EXE
        uses: actions/upload-artifact@v7
        with:
          name: JustVolleyballJA-windows-x64-${{ github.sha }}
          path: dist/ci/JustVolleyballJA.exe
          if-no-files-found: error
          retention-days: 30
